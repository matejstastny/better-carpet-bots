name: Release

on:
    push:
        tags:
            - "v*.*.*[+]*"
    workflow_dispatch:
        inputs:
            tag:
                description: "Tag to release (v1.0.0+1.21.11)"
                required: true

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Resolve tag
              id: tag
              run: |
                  TAG="${{ github.event.inputs.tag || github.ref_name }}"
                  WITHOUT_V="${TAG#v}"
                  MOD_VERSION="${WITHOUT_V%%+*}"
                  MC_VERSION="${WITHOUT_V##*+}"
                  echo "tag=$TAG"           >> $GITHUB_OUTPUT
                  echo "mod_version=$MOD_VERSION" >> $GITHUB_OUTPUT
                  echo "mc_version=$MC_VERSION"   >> $GITHUB_OUTPUT

            - uses: actions/checkout@v4
              with:
                  ref: ${{ steps.tag.outputs.tag }}

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21
                  cache: gradle

            - name: Build
              run: ./gradlew build --no-daemon

            - name: Publish to Modrinth
              env:
                  MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
                  MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
                  RELEASE_NOTES: ${{ github.event.release.body || '' }}
              run: ./gradlew modrinth --no-daemon

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.tag.outputs.tag }}
                  name: "v${{ steps.tag.outputs.mod_version }} for MC ${{ steps.tag.outputs.mc_version }}"
                  files: |
                      build/libs/*.jar
                      !build/libs/*-dev.jar
                  generate_release_notes: true
